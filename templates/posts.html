<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts - My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <div class="container">
        {% include "nav.html" %}

        <main>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h1 style="margin-bottom: 0;">All Blog Posts</h1>
                <a href="/posts/new" class="btn">+ Write Post</a>
            </div>

            <form action="/posts" method="GET" class="search-form">
                <input
                    type="text"
                    name="search"
                    placeholder="Search posts by title or content..."
                    value="{{ search_query }}">
                <button type="submit">Search</button>
                <a href="/posts" class="btn-clear">Clear</a>
            </form>

            <ul class="post-list">
                {% for post in posts %}
                    <li>
                        <a href="/posts/{{ post.id }}">{{ post.title }}</a>
                        <div class="post-meta" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.35rem;">
                            By {{ post.author_name }}
                        </div>
                    </li>
                {% empty %}
                    <p>No posts found matching your search.</p>
                {% endfor %}
            </ul>
        </main>
    </div>
</body>
</html>
