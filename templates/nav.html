<header>
    <a href="/" class="site-title">PyBlog</a>
    <nav>
        <a href="/">Home</a>
        <a href="/posts/new">Write Post</a>
        {% if user %}
            <span style="color: var(--text-secondary); margin-right: 0.5rem;">👤 {{ user.display_name }}</span>

    </nav>
