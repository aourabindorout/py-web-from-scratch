<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="site-title">PyBlog</a>
            <nav>
                <a href="/">Home</a>
                <a href="/posts/new">Write Post</a>
                {{ auth_nav }}
                <button id="theme-toggle" class="theme-toggle-btn">🌙 Night</button>
            </nav>
        </header>

        <main>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                <h1 style="margin-bottom: 0;">All Blog Posts</h1>
                <a href="/posts/new" class="btn">+ Write Post</a>
            </div>

            <form action="/" method="GET" class="search-form">
                <input
                    type="text"
                    name="search"
                    placeholder="Search posts by title or content..."
                    value="{{ search_query }}">
                <button type="submit">Search</button>
                <a href="/" class="btn-clear">Clear</a>
            </form>

            <ul class="post-list">
                {{ posts }}
            </ul>
        </main>
    </div>
</body>
</html>
