<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <div class="container">
        {% include "nav.html" %}

        <main class="card" style="max-width: 440px; margin: 2rem auto;">
            <h1>Create Account</h1>
            <p style="margin-bottom: 1.5rem;">Join the blog. Passwords are securely hashed with PBKDF2.</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        id="name"
                        type="text"
                        name="name"
                        value="{{ name }}"
                        placeholder="e.g. John Doe"
                        required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        value="{{ username }}"
                        placeholder="Choose a username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="At least 6 characters"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        placeholder="Re-enter password"
                        required>
                </div>

                <button type="submit" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
            </form>

            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </main>
    </div>
</body>
</html>
