<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="site-title">PyBlog</a>
            <nav>
                <a href="/">Home</a>
                <a href="/posts/new">Write Post</a>
                {{ auth_nav }}
                <button id="theme-toggle" class="theme-toggle-btn">🌙 Night</button>
            </nav>
        </header>

        <main class="card" style="max-width: 440px; margin: 2rem auto;">
            <h1>Create Account</h1>
            <p style="margin-bottom: 1.5rem;">Join the blog. Passwords are securely hashed with PBKDF2.</p>

            {{ error }}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="e.g. John Doe"
                        required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Choose a username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password (min 6 chars)</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        placeholder="••••••••"
                        required>
                </div>

                <button type="submit" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>

                <p style="text-align: center; margin-top: 1.25rem; font-size: 0.95rem; color: var(--text-secondary);">
                    Already have an account? <a href="/login">Sign In</a>
                </p>
            </form>
        </main>
    </div>
</body>
</html>
